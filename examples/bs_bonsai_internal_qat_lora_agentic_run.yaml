base_model: prism-ml/Ternary-Bonsai-4B-unpacked
model_type: AutoModelForCausalLM
tokenizer_type: AutoTokenizer

load_in_8bit: false
load_in_4bit: false
strict: false

plugins:
  - axolotl.integrations.bs_qat.BSQATPlugin
  - axolotl.integrations.liger.LigerPlugin

liger_rope: true
liger_rms_norm: true
liger_glu_activation: true
liger_layer_norm: true
liger_fused_linear_cross_entropy: true

bs_qat: true
bs_qat_mode: "ternary"
bs_qat_group_size: 128
bs_qat_act_quant: false
# internal_qat: LoRA lives inside BitLinear (QDQ(W + LoRA)), matching the baked
# Q2_0 GGUF deployment objective. See plugin.py module docstring.
bs_qat_lora_mode: "internal_qat"
bs_qat_lora_r: 128
bs_qat_lora_alpha: 256
bs_qat_lora_dropout: 0.05
bs_qat_freeze_non_lora: true
bs_qat_target_names:
  - "q_proj"
  - "k_proj"
  - "v_proj"
  - "o_proj"
  - "gate_proj"
  - "up_proj"
  - "down_proj"
bs_qat_skip_names:
  - "lm_head"

# internal_qat requires adapter to be unset — PEFT must never wrap the model,
# see BSQATPlugin._validate_internal_qat_cfg.
adapter:

datasets:
  - path: custom-org/planning-sft-dataset-v07022026
    name: "1.v2"
    type: chat_template
  - path: custom-org/planning-sft-dataset-v07022026
    name: "2.v01"
    type: chat_template
  - path: custom-org/planning-sft-dataset-v07022026
    name: "3.bucket_b"
    type: chat_template
  # Tool-calling data. field_thinking/template_thinking_key are explicitly
  # nulled so reasoning_content is dropped before tokenization -- we train on
  # tool_calls/content only, not the reasoning traces.
  # Local copies: the hub tool_calling.parquet has a __parse_error column with
  # one malformed record that breaks pyarrow schema casting on load; these are
  # the same rows with only messages/tools kept and the bad row dropped.
  - path: local_data/nemotron_v2_search.parquet
    ds_type: parquet
    type: chat_template
    field_messages: messages
    field_tools: tools
    field_thinking:
    template_thinking_key:
  - path: local_data/nemotron_v2_tool_calling.parquet
    ds_type: parquet
    type: chat_template
    field_messages: messages
    field_tools: tools
    field_thinking:
    template_thinking_key:
  # Local copy: the hub repo's split-discovery also builds the raw
  # `interactive_agent.parquet` file (same CastError as tool_calling above) even
  # when only `train` is requested, so pull the clean train parquet directly.
  - path: local_data/nemotron_v1_interactive_agent_train.parquet
    ds_type: parquet
    type: chat_template
    field_messages: messages
    field_tools: tools
    field_thinking:
    template_thinking_key:

dataset_prepared_path: last_run_prepared_agentic_internal_qat
val_set_size: 0
output_dir: ./runs/axolotl-bs-internal-qat-lora-agentic
dataset_processes: 128

sequence_len: 16384
sample_packing: true
pad_to_sequence_len: true

gradient_accumulation_steps: 2
micro_batch_size: 16
num_epochs: 1
optimizer: adamw_torch
lr_scheduler: cosine
learning_rate: 1.0e-4
warmup_ratio: 0.05
weight_decay: 0.01

train_on_inputs: false
group_by_length: false
bf16: false
fp16: true
tf32: false

gradient_checkpointing: true
attn_implementation: kernels-community/flash-attn3
dataloader_num_workers: 0

eval_steps:
save_steps: 200
logging_steps: 5
