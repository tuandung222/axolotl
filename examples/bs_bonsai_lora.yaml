base_model: prism-ml/Ternary-Bonsai-4B-unpacked
model_type: AutoModelForCausalLM
tokenizer_type: AutoTokenizer

load_in_8bit: false
load_in_4bit: false
strict: false

# Kích hoạt Plugin của KH
plugins:
  - axolotl.integrations.bs_qat.BSQATPlugin

bs_qat: true
bs_qat_mode: "ternary"
bs_qat_group_size: 128
bs_qat_act_quant: false
bs_qat_target_names:
  - "q_proj"
  - "k_proj"
  - "v_proj"
  - "o_proj"
  - "gate_proj"
  - "up_proj"
  - "down_proj"
bs_qat_skip_names:
  - "lm_head"

# Dataset
datasets:
  - path: /home/dungvpt/low_bit_research/axolotl_tuandunghcmut/examples/tiny_data.jsonl
    type: chat_template

dataset_prepared_path: last_run_prepared
val_set_size: 0
output_dir: ./runs/axolotl-bs-lora

# Cấu hình Sequence & Packing
sequence_len: 4096
sample_packing: true
pad_to_sequence_len: true

# Cấu hình LoRA
adapter: lora
lora_model_dir:
lora_r: 128
lora_alpha: 256
lora_dropout: 0.05
lora_target_linear: true
lora_fan_in_fan_out:
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# Hyperparameters
gradient_accumulation_steps: 4
micro_batch_size: 4
max_steps: 1000
optimizer: adamw_torch
lr_scheduler: cosine
learning_rate: 1.0e-4
warmup_ratio: 0.05
weight_decay: 0.01

train_on_inputs: false
group_by_length: false
bf16: auto
fp16: false
tf32: false

gradient_checkpointing: true
flash_attention: true

eval_steps:
save_steps: 200
logging_steps: 5
